
openapi: 3.1.0

info:
  title: Naval Wargame API
  version: 0.1.0
  description: API de gestion d'un wargame naval tactique au tour par tour.

servers:
  - url: http://localhost:5000/api/v1
    description: Serveur local de développement

tags:
  - name: Games
    description: Création et consultation des parties
  - name: Orders
    description: Préparation des ordres du joueur
  - name: Turns
    description: Résolution des tours
  - name: Journal
    description: Rapports opérationnels

paths:
  /games:
    post:
      tags: [Games]
      operationId: createGame
      summary: Créer une nouvelle partie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameRequest"
      responses:
        "201":
          description: Partie créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "400":
          $ref: "#/components/responses/BadRequest"

  /games/{gameId}:
    parameters:
      - $ref: "#/components/parameters/GameId"
    get:
      tags: [Games]
      operationId: getGame
      summary: Consulter l'état visible de la partie
      responses:
        "200":
          description: État courant du jeu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "404":
          $ref: "#/components/responses/NotFound"

  /games/{gameId}/orders:
    parameters:
      - $ref: "#/components/parameters/GameId"
    put:
      tags: [Orders]
      operationId: submitOrders
      summary: Enregistrer les ordres du tour en cours
      description: >
        Chaque unité contrôlée peut recevoir un déplacement de 0 à 3 hexagones
        et une action facultative. Les ordres ne sont pas encore résolus.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitOrdersRequest"
      responses:
        "200":
          description: Ordres validés et enregistrés
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Partie terminée ou tour déjà résolu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /games/{gameId}/turns/resolve:
    parameters:
      - $ref: "#/components/parameters/GameId"
    post:
      tags: [Turns]
      operationId: resolveTurn
      summary: Résoudre un tour complet
      description: >
        Résout les ordres du joueur, les conséquences associées,
        le tour de l'IA ennemie, les détections et les événements.
        Retourne uniquement les informations accessibles au joueur.
      responses:
        "200":
          description: Tour résolu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Ordres absents ou tour non résolvable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /games/{gameId}/journal:
    parameters:
      - $ref: "#/components/parameters/GameId"
    get:
      tags: [Journal]
      operationId: getJournal
      summary: Consulter le journal de bord
      parameters:
        - name: afterTurn
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: Ne retourner que les entrées des tours suivants.
      responses:
        "200":
          description: Entrées du journal accessibles au joueur
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/JournalEntry"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    GameId:
      name: gameId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Partie introuvable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    HexCoordinate:
      type: object
      required: [x, y]
      properties:
        x:
          type: integer
          minimum: 0
          description: Colonne hexagonale, origine en haut à gauche.
        y:
          type: integer
          minimum: 0
          description: Ligne hexagonale, origine en haut à gauche.

    CreateGameRequest:
      type: object
      required: [scenarioId, seed, fleet]
      properties:
        scenarioId:
          type: string
          enum:
            - carrier_escort
            - enemy_elimination
            - humanitarian_rescue
        seed:
          type: integer
          description: Graine permettant de reproduire la génération procédurale.
        fleet:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/FleetSelection"
        constraints:
          type: array
          items:
            type: string
          description: Malus choisis pour la mission.

    FleetSelection:
      type: object
      required: [unitType, quantity]
      properties:
        unitType:
          type: string
          enum: [frigate_asm, frigate_aa, submarine, patrol_vessel]
        quantity:
          type: integer
          minimum: 1
          maximum: 10

    GameState:
      type: object
      required: [gameId, status, turn, map, friendlyUnits, contacts]
      properties:
        gameId:
          type: string
          format: uuid
        status:
          type: string
          enum: [planning, active, victory, defeat]
        turn:
          type: integer
          minimum: 1
        map:
          type: object
          required: [width, height, seed]
          properties:
            width:
              type: integer
            height:
              type: integer
            seed:
              type: integer
        friendlyUnits:
          type: array
          items:
            $ref: "#/components/schemas/FriendlyUnit"
        contacts:
          type: array
          description: Contacts ennemis connus ou estimés uniquement.
          items:
            $ref: "#/components/schemas/EnemyContact"

    FriendlyUnit:
      type: object
      required: [unitId, unitType, position, status]
      properties:
        unitId:
          type: string
        unitType:
          type: string
        position:
          $ref: "#/components/schemas/HexCoordinate"
        status:
          type: string
          enum: [operational, degraded, critical, destroyed]
        weapons:
          type: object
          additionalProperties:
            type: integer
            minimum: 0

    EnemyContact:
      type: object
      required: [contactId, classification, confidence]
      properties:
        contactId:
          type: string
          example: S-01
        estimatedPosition:
          $ref: "#/components/schemas/HexCoordinate"
        positionErrorHexes:
          type: integer
          minimum: 0
        classification:
          type: string
          enum:
            - unknown
            - surface_vessel
            - submarine
            - aircraft
        confidence:
          type: number
          minimum: 0
          maximum: 1
        lastDetectedTurn:
          type: integer

    SubmitOrdersRequest:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/UnitOrder"

    UnitOrder:
      type: object
      required: [unitId, destination]
      properties:
        unitId:
          type: string
        destination:
          $ref: "#/components/schemas/HexCoordinate"
        action:
          oneOf:
            - $ref: "#/components/schemas/PrepareTorpedoAction"
            - $ref: "#/components/schemas/ActiveSonarAction"
            - $ref: "#/components/schemas/RepairAction"
            - $ref: "#/components/schemas/LaunchHelicopterAction"
            - $ref: "#/components/schemas/WaitAction"
          discriminator:
            propertyName: type
            mapping:
              prepare_torpedo: "#/components/schemas/PrepareTorpedoAction"
              active_sonar: "#/components/schemas/ActiveSonarAction"
              repair: "#/components/schemas/RepairAction"
              launch_helicopter: "#/components/schemas/LaunchHelicopterAction"
              wait: "#/components/schemas/WaitAction"

    PrepareTorpedoAction:
      type: object
      required: [type]
      properties:
        type:
          const: prepare_torpedo

    ActiveSonarAction:
      type: object
      required: [type]
      properties:
        type:
          const: active_sonar

    RepairAction:
      type: object
      required: [type]
      properties:
        type:
          const: repair

    LaunchHelicopterAction:
      type: object
      required: [type]
      properties:
        type:
          const: launch_helicopter

    WaitAction:
      type: object
      required: [type]
      properties:
        type:
          const: wait
      description: Action sans effet opérationnel, si une action est explicitement requise.

    OrdersAccepted:
      type: object
      required: [gameId, turn, accepted]
      properties:
        gameId:
          type: string
          format: uuid
        turn:
          type: integer
        accepted:
          type: boolean

    TurnResult:
      type: object
      required: [turn, status, gameState, journalEntries]
      properties:
        turn:
          type: integer
        status:
          type: string
          enum: [active, victory, defeat]
        gameState:
          $ref: "#/components/schemas/GameState"
        journalEntries:
          type: array
          items:
            $ref: "#/components/schemas/JournalEntry"

    JournalEntry:
      type: object
      required: [entryId, turn, category, message]
      properties:
        entryId:
          type: string
        turn:
          type: integer
        time:
          type: string
          example: "09:45"
        category:
          type: string
          enum:
            - operations
            - sonar
            - radar
            - armament
            - enemy
            - incident
            - assessment
        unitId:
          type: string
        position:
          $ref: "#/components/schemas/HexCoordinate"
        message:
          type: string
          example: "Contact S-01 détecté en (20,11)."
        confidence:
          type: number
          minimum: 0
          maximum: 1

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
